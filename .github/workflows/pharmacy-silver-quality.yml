name: Pharmacy Silver v3 Quality
on:
  pull_request:
    paths:
      - 'silver_v3/**'
      - 'tests/**'
      - '.github/workflows/pharmacy-silver-quality.yml'
permissions:
  contents: read
concurrency:
  group: pharmacy-silver-quality
  cancel-in-progress: false
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'boto3>=1.35,<2' 'openpyxl>=3.1,<4'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q silver_v3
