name: Gold PostgreSQL integration tests
on:
  pull_request:
    paths:
      - 'gold_auto/**'
      - 'tests/test_gold_auto.py'
      - '.github/workflows/pharmacy-gold-tests.yml'
  push:
    branches: [main]
    paths:
      - 'gold_auto/**'
      - 'tests/test_gold_auto.py'
      - '.github/workflows/pharmacy-gold-tests.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goldtest
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: goldtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goldtest -d goldtest"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      GOLD_TEST_DSN: postgresql://goldtest:testonly@localhost:5432/goldtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - run: python -m unittest discover -s tests -p 'test_gold_auto.py' -v
      - run: python -m compileall -q gold_auto
