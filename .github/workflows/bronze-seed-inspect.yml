name: Inspect Bronze seed schemas
on:
  push:
    branches: [feature/bronze-compact-csv]
    paths:
      - .github/workflows/bronze-seed-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install boto3 openpyxl
      - name: Inspect schema only, no mutations
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python pipeline/bronze/inspect_seeds.py
