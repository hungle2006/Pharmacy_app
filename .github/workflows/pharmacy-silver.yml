name: Pharmacy Silver Cloud Run
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validation only (uncheck only after approval)"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
  id-token: write
concurrency:
  group: pharmacy-silver
  cancel-in-progress: false
jobs:
  deploy-and-run:
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_RUN_SA != '' && vars.R2_ENDPOINT != ''
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image
        run: |
          gcloud builds submit . --tag "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/pharmacy/silver:${{ github.sha }}"
      - name: Deploy job
        run: |
          gcloud run jobs deploy pharmacy-silver \
            --image "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/pharmacy/silver:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_RUN_SA }}" \
            --memory 8Gi --cpu 2 --task-timeout 3600 --max-retries 1 \
            --set-env-vars "R2_BUCKET=pharmacy-data-lake,R2_ENDPOINT=${{ vars.R2_ENDPOINT }}" \
            --set-secrets "AWS_ACCESS_KEY_ID=r2-access-key:latest,AWS_SECRET_ACCESS_KEY=r2-secret-key:latest"
      - name: Execute
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
        run: |
          gcloud run jobs execute pharmacy-silver --region "${{ vars.GCP_REGION }}" \
            --update-env-vars "DRY_RUN=$DRY_RUN" --wait
