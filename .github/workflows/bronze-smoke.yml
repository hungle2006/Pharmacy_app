name: Bronze Python Smoke Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bronze-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bronze dependencies
        run: python -m pip install -r pipeline/bronze/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q pipeline/bronze
      - name: Test RXNCONSO, release selection, MEDI watcher
        run: python -m unittest discover -s tests -p 'bronze_pipeline.test.py' -v
