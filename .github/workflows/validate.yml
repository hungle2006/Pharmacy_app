name: Validate PharmaBiz
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Validate JavaScript
        run: |
          node --check assets/presentation.js
          node --check assets/scene.js
          node --check api/analytics.js
          node --check api/data.js
          node --check api/insights.js
      - name: Verify expected website assets
        run: |
          test -s index.html
          test -s assets/visual.css
          test -s assets/scene3d.js
          test -s assets/models/pharmabiz-capsule.glb
          grep -q 'assets/presentation.js' index.html
          grep -q 'api/analytics' assets/presentation.js
