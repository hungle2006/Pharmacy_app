name: One-time DAV Bronze CSV initialization
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bronze-dav-initialize.yml
permissions:
  contents: read
jobs:
  initialize-dav:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: pharmacy-bronze-dav
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: pharmacy-data-lake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r pipeline/bronze/requirements.txt
      - name: Crawl complete DAV snapshot into cumulative Bronze CSV
        run: python -u pipeline/bronze/run_compact.py --source dav
