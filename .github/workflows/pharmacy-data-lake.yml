name: Pharmacy weekly Bronze ingestion
on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to ingest
        type: choice
        required: true
        default: all
        options: [all, dav, icd10, rxnorm, medi]
  schedule:
    - cron: '19 2 * * 2'
      timezone: 'Asia/Ho_Chi_Minh'
permissions:
  contents: read
jobs:
  select-sources:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
    steps:
      - id: pick
        env:
          TARGET: ${{ inputs.source }}
        shell: bash
        run: |
          if [[ -z "$TARGET" || "$TARGET" == "all" ]]; then
            echo 'sources=["dav","icd10","rxnorm","medi"]' >> "$GITHUB_OUTPUT"
          else
            case "$TARGET" in
              dav|icd10|rxnorm|medi) printf 'sources=["%s"]\n' "$TARGET" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Unknown source $TARGET"; exit 1 ;;
            esac
          fi

  ingest:
    name: "Bronze · ${{ matrix.source }}"
    needs: select-sources
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.select-sources.outputs.sources) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: pharmacy-bronze-${{ matrix.source }}
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: pharmacy-data-lake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r pipeline/bronze/requirements.txt
      - name: Verify R2 secrets
        if: matrix.source != 'medi'
        shell: bash
        run: |
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "::error::R2 repository secrets are missing"
            exit 1
          fi
      - name: Run selected source
        env:
          SOURCE: ${{ matrix.source }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE" in
            dav|icd10) python -u pipeline/bronze/run_crawlers.py --source "$SOURCE" ;;
            rxnorm) python -u pipeline/bronze/rxnorm_pipeline.py ;;
            medi) python -u pipeline/bronze/medi_watch.py ;;
          esac
