name: Pharmacy weekly Bronze ingestion
on:
  push:
    branches:
      - feature/bronze-four-source-automation
    paths:
      - .github/workflows/pharmacy-data-lake.yml
  workflow_dispatch:
    inputs:
      source:
        description: Source to ingest (all = DAV, ICD-10, RxNorm, MEDI watch)
        type: choice
        required: true
        default: all
        options: [all, dav, icd10, rxnorm, medi]
  schedule:
    - cron: '19 2 * * 2'
      timezone: 'Asia/Ho_Chi_Minh'
permissions:
  contents: read
concurrency:
  group: pharmacy-bronze-ingestion
  cancel-in-progress: false
jobs:
  bronze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: pharmacy-data-lake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r pipeline/bronze/requirements.txt
      - name: Validate Python modules
        run: python -m compileall -q pipeline/bronze
      - name: Require R2 repository secrets
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY" || { echo '::error::R2 secrets missing'; exit 1; }
      - name: Ingest or check source
        env:
          SOURCE: ${{ github.event.inputs.source }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" || "$EVENT" == "schedule" || "$SOURCE" == "all" || -z "$SOURCE" ]]; then
            tasks=(dav icd10 rxnorm medi)
          else
            tasks=("$SOURCE")
          fi
          failed=0
          for task in "${tasks[@]}"; do
            echo "::group::$task"
            case "$task" in
              dav|icd10) python -u pipeline/bronze/run_crawlers.py --source "$task" || failed=1 ;;
              rxnorm) python -u pipeline/bronze/rxnorm_pipeline.py || failed=1 ;;
              medi) python -u pipeline/bronze/medi_watch.py || failed=1 ;;
              *) echo "::error::Unsupported source $task"; failed=1 ;;
            esac
            echo "::endgroup::"
          done
          exit "$failed"
