name: Train Pharmacy Price Model
# Preserve workflow name so GitHub -> Render deploy hook continues to work.
# The published product is now a MARKET-WIDE trend report, NOT per-drug prices.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Pharmacy Silver automatic R2"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'ml_price/**'
      - '.github/workflows/train-price-model.yml'
      - 'assets/market-forecast.js'
  schedule:
    - cron: '0 3 * * 0' # 10:00 Sunday Vietnam
permissions:
  contents: read
  actions: read
concurrency:
  group: pharmacy-market-forecast
  cancel-in-progress: false
jobs:
  train:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Verify Gold finished and was not a dry run
        id: upstream
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'workflow_run') {
              core.setOutput('ready', 'true'); return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.payload.workflow_run.id, per_page: 100
            });
            core.setOutput('ready', String(artifacts.some(a => a.name === 'gold-feature-training-ready' && !a.expired)));
      - uses: actions/checkout@v4
        if: steps.upstream.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.upstream.outputs.ready == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml_price/requirements-train.txt
      - name: Install forecast evaluation dependencies
        if: steps.upstream.outputs.ready == 'true'
        run: python -m pip install -r ml_price/requirements-train.txt
      - name: Test global market forecast quality and front-end syntax
        if: steps.upstream.outputs.ready == 'true'
        run: |
          python -m unittest discover -s ml_price/tests -p 'test_*.py' -v
          python -m py_compile ml_price/market_models.py ml_price/market_forecast.py ml_price/market_store.py ml_price/serve.py ml_price/upload_market.py
          node --check api/market-forecast.js
          node --check assets/market-forecast.js
          node --check assets/drug-lookup.js
      - name: Evaluate actual DAV market price changes on Neon Gold
        if: steps.upstream.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
        run: python -m ml_price.market_forecast
      - name: Summarize market price trend evaluation
        if: steps.upstream.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("models/market/report.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## DAV market price outlook\n")
              f.write(f"Observed time-separated pairs: {r['labeled_pairs']}\n\n")
              for h,item in r['horizons'].items():
                  f.write(f"- {h} months: {item['status']}; {item.get('n_products',0)} drugs; "
                          f"historical median {item.get('historical_change_pct')}%; "
                          f"approved forecast {item.get('forecast_change_pct')}%, " +
                          f"selected={item.get('selected_model')}, folds={item.get('n_walkforward_folds')}, " +
                          f"test gain={item.get('test_gain_fraction')}, " +
                          f"bootstrap95={item.get('test_gain_ci95_pct_points')}\n")
              f.write("\nHistorical descriptive metrics are published with explicit labels even when no future forecast is approved.\n")
          PY
      - name: Archive report
        if: always() && steps.upstream.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dav-market-price-trends-${{ github.run_number }}
          path: models/market/report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Publish aggregate report to private R2
        if: steps.upstream.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          ML_R2_ENDPOINT: ${{ secrets.ML_R2_ENDPOINT || secrets.R2_ENDPOINT }}
          ML_R2_BUCKET: ${{ secrets.ML_R2_BUCKET || secrets.R2_BUCKET }}
          ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for var in ML_R2_ENDPOINT ML_R2_BUCKET ML_R2_ACCESS_KEY_ID ML_R2_SECRET_ACCESS_KEY; do
            if [ -z "${!var}" ]; then echo "::error::Missing GitHub secret: $var" >&2; exit 1; fi
          done
          python -m ml_price.upload_market
