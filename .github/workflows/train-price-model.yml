name: Train Pharmacy Price Model
# The workflow name is preserved so GitHub -> Render deploy automation can
# continue to trigger on successful main-branch runs.
on:
  workflow_dispatch:
  push:
    branches: [main, feature/market-price-forecast-dashboard-20261022]
    paths:
      - 'ml_price/**'
      - '.github/workflows/train-price-model.yml'
  schedule:
    - cron: '0 3 * * 0' # Sunday 10:00 Vietnam
permissions:
  contents: read
concurrency:
  group: pharmacy-market-price-forecast
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml_price/requirements-train.txt
      - name: Install training dependencies
        run: python -m pip install -r ml_price/requirements-train.txt
      - name: Test market trend logic and API without production credentials
        run: |
          python -m unittest discover -s ml_price/tests -p 'test_*.py' -v
          python -m py_compile ml_price/market_forecast.py ml_price/market_store.py ml_price/serve.py ml_price/upload_market_forecast.py
          node --check api/market-forecast.js
          node --check assets/market-forecast.js
          node --check assets/drug-lookup.js
      - name: Backtest aggregate market movement against unchanged-price baseline
        id: backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
        run: |
          python -m ml_price.market_forecast
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("models/market/report.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("approved="+str(bool(r.get("approved_horizons"))).lower()+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Market price outlook – paired DAV declarations\n")
              f.write("Status: **"+r["status"]+"**\n\n")
              f.write("Actual matched price pairs: "+str(r["paired_observations"])+"\n\n")
              for h,details in r["horizons"].items():
                  f.write("- "+h+" months: "+details["status"]+" | historical "+str(details.get("historical_change_pct"))+"% | projected "+str(details.get("forecast_change_pct"))+"% | matched "+str(details.get("n_pairs"))+"\n")
              f.write("\nHistory published; future projections shown only for horizons that pass the backtest.\n")
          PY
      - name: Save forecast backtest report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-market-outlook-${{ github.run_number }}
          path: models/market/report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Publish historical market report and any approved forecasts to Cloudflare R2
        if: github.ref == 'refs/heads/main' && steps.backtest.outcome == 'success'
        env:
          ML_R2_ENDPOINT: ${{ secrets.ML_R2_ENDPOINT || secrets.R2_ENDPOINT }}
          ML_R2_BUCKET: ${{ secrets.ML_R2_BUCKET || secrets.R2_BUCKET }}
          ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for var in ML_R2_ENDPOINT ML_R2_BUCKET ML_R2_ACCESS_KEY_ID ML_R2_SECRET_ACCESS_KEY; do
            if [ -z "${!var}" ]; then echo "::error::Missing GitHub secret $var" >&2; exit 1; fi
          done
          python -m ml_price.upload_market_forecast
