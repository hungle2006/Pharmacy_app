name: Disease dataset - source enrichment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - disease_monthly_pipeline/web_collectors.py
      - disease_monthly_pipeline/web_collectors.json
      - disease_monthly_pipeline/enrichment.py
      - disease_monthly_pipeline/enrichment_config.json
      - disease_monthly_pipeline/crawl_sources.json
      - disease_monthly_pipeline/published_sources.py
      - disease_monthly_pipeline/published_sources.json
      - disease_monthly_pipeline/ddxplus.py
      - disease_monthly_pipeline/ddxplus_sources.json
      - disease_monthly_pipeline/balancing.py
      - disease_monthly_pipeline/config.json
      - disease_monthly_pipeline/train.py
      - disease_monthly_pipeline/modal_app.py
      - disease_monthly_pipeline/pipeline.py
      - disease_monthly_pipeline/data_pipeline.py
      - disease_monthly_pipeline/release.py
      - disease_monthly_pipeline/requirements-train.txt
      - .github/workflows/disease-enrichment.yml
permissions:
  contents: read
concurrency:
  group: disease-monthly-submit
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: disease_monthly_pipeline
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'modal>=1.2,<2'
      - run: modal deploy modal_app.py
      - name: Run bounded CPU crawl and verify publication
        run: |
          python - <<'PY'
          import modal,json
          print('Before refresh:',json.dumps(modal.Function.from_name('disease-monthly-pipeline','operations_status').remote(),ensure_ascii=False))
          try:
              result=modal.Function.from_name('disease-monthly-pipeline','refresh_dataset').remote()
          except Exception as error:
              print('Modal call error type:',type(error).__name__)
              raise SystemExit('Dataset refresh failed. Inspect Modal logs privately.') from None
          print(json.dumps({k:result[k] for k in ['status','statistics','rows_before','rows_after','added_by_label','discovery_enabled','web_collectors','balance_before','balance_after','commit','error_type','error_frames'] if k in result},ensure_ascii=False))
          if result.get('status')=='failed':
              raise SystemExit('Refresh failed; see sanitized error type and source line above.')
          call=modal.Function.from_name('disease-monthly-pipeline','pipeline').spawn(submission_id='balanced-source-enrichment',wait_for_lock=True)
          print('Pipeline submitted:',call.object_id)
          print('It waits up to 30 minutes for an existing operation. Submission is not training completion or model promotion.')
          print('After submission:',json.dumps(modal.Function.from_name('disease-monthly-pipeline','operations_status').remote(),ensure_ascii=False))
          PY
