name: Disease pipeline tests
on:
  pull_request:
    paths:
      - 'disease_monthly_pipeline/**'
      - '.github/workflows/disease-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r disease_monthly_pipeline/requirements-test.txt
      - run: python -m pytest -q disease_monthly_pipeline/tests
