name: Disease pipeline tests
on:
  pull_request:
    paths:
      - 'disease_monthly_pipeline/**'
      - '.github/workflows/disease-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r disease_monthly_pipeline/requirements-test.txt
      - run: python -m pytest -q disease_monthly_pipeline/tests

  weighted-trainer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r disease_monthly_pipeline/requirements-test.txt transformers==4.57.1 accelerate==1.11.0
      - run: python -m pytest -q disease_monthly_pipeline/tests/test_balancing_ddxplus.py
  public-source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r disease_monthly_pipeline/requirements-test.txt
      - run: python disease_monthly_pipeline/source_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: ddxplus-public-source-pilot
          path: /tmp/ddxplus-pilot-result.json
