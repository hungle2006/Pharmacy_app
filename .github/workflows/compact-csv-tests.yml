name: Compact Bronze CSV tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r pipeline/bronze/requirements.txt
      - run: python -m compileall -q pipeline/bronze
      - run: python -m unittest discover -s tests -p 'test_compact_csv.py' -v
