name: R2 Credentials Preflight
on:
  push:
    branches: [feature/bronze-four-source-automation]
permissions:
  contents: read
jobs:
  r2-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install boto3
      - name: Roundtrip temporary R2 object
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: pharmacy-data-lake
        run: python pipeline/bronze/r2_preflight.py
