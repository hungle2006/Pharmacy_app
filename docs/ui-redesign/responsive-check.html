<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacy · Responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#e7ece9;font:14px system-ui}header{display:flex;align-items:center;padding:10px 18px;gap:8px;height:64px}button,select{font:14px system-ui;min-height:44px;padding:9px 13px;border:1px solid #b5cbc0;border-radius:8px;background:#fff;color:#214b3d}iframe{display:block;margin:auto;border:0;background:#fff;width:100%;height:calc(100vh - 64px)}body.phone iframe{width:375px;max-width:100%;height:812px}body.small iframe{width:360px}body.tablet iframe{width:768px;max-width:100%}</style><body class="phone"><header><button id="laptop">Laptop</button><button id="phone">375px</button><button id="small">360px</button><button id="tablet">768px</button><select id="view" aria-label="Tác vụ cần kiểm tra"><option value="overview">Tổng quan</option><option value="intro">Start</option><option value="lookup">Tra cứu thuốc</option><option value="disease-predict">Dự đoán bệnh</option><option value="market-forecast">Dự báo thị trường</option><option value="feature-price">Dự đoán giá</option><option value="pricing">Phân tích giá</option><option value="competition">Cạnh tranh</option><option value="portfolio">Danh mục</option><option value="quality">Chất lượng</option><option value="business">Đề tài</option><option value="workflow">Nguồn dữ liệu</option><option value="reports">Thống kê</option><option value="eda">EDA</option><option value="preparation">Làm sạch</option><option value="modeling">Mô hình</option><option value="disease">Tra cứu ICD</option><option value="appendix">Phụ lục RxNorm</option><option value="baseline">Start hiện tại</option></select></header><iframe id="app-review" title="Pharmacy App đang chạy" src="/?view=overview"></iframe><script>for(const mode of ['laptop','phone','small','tablet'])document.getElementById(mode).onclick=()=>document.body.className=mod
